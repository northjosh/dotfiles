onboarding = false
[theme]
# Match the Catppuccin tmux theme; follow the terminal's light/dark switch.
auto_switch = false
dark_name = "catppuccin"
light_name = "catppuccin-latte"

name = "catppuccin"
[theme.custom]
accent = "#cba6f7"

[ui]
agent_panel_sort = "spaces"
# tmux keeps its status line at the bottom; put the tab row there too.
tab_bar_position = "bottom"
hide_tab_bar_when_single_tab = false
pane_borders = true
show_agent_labels_on_pane_borders = true

# tmux-style status rows for each agent in the sidebar.
[ui.sidebar.agents]
row_gap = 0
rows = [
	[
		{ token = "state_icon" },
		{ token = "workspace", fg = "#cba6f7", bold = true },
		{ token = "tab", fg = "#89b4fa" },
	],
	[{ token = "terminal_title_stripped", fg = "#cdd6f4", dim = true }],
	[{ token = "agent", fg = "#a6e3a1" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
	[
		{ token = "state_icon" },
		{ token = "workspace", fg = "#cba6f7", bold = true },
		{ token = "tab", fg = "#89b4fa" },
	],
	[{ token = "terminal_title_stripped", fg = "#cdd6f4", dim = true }],
	[{ token = "agent", fg = "#f5c2e7" }],
]

# tmux-style status rows for each space: name, branch, git status.
[ui.sidebar.spaces]
row_gap = 0
rows = [
	[{ token = "state_icon" }, { token = "workspace", fg = "#cba6f7", bold = true }],
	[{ token = "branch", fg = "#a6e3a1" }, { token = "git_status", fg = "#fab387" }],
]

[ui.toast]
delivery = "system"
